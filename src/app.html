let dateiDB=null; const DATEI_DA=new Set();
function dateiOpen(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(0); const r=indexedDB.open("evse_dateien",1); r.onupgradeneeded=()=>r.result.createObjectStore("d"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function dateiInit(){ try{ dateiDB=await dateiOpen(); (await idbReq(dateiDB.transaction("d").objectStore("d").getAllKeys())).forEach(k=>DATEI_DA.add(k)); }catch(e){ dateiDB=null; } }
function dateiPut(id,o){ return new Promise(res=>{ if(!dateiDB) return res(false); try{ const t=dateiDB.transaction("d","readwrite"); t.objectStore("d").put(o,id); t.oncomplete=()=>{ DATEI_DA.add(id); res(true); }; t.onerror=t.onabort=()=>res(false); }catch(e){ res(false); } }); }
async function dateiGet(id){ if(!dateiDB) return null; try{ return await idbReq(dateiDB.transaction("d").objectStore("d").get(id)); }catch(e){ return null; } }
function dateiDel(ids){ ids.filter(Boolean).forEach(i=>DATEI_DA.delete(i)); if(!dateiDB) return; try{ const t=dateiDB.transaction("d","readwrite"); ids.forEach(i=>t.objectStore("d").delete(i)); }catch(e){} }
const groesse=b=>!b?"":b<1048576?`${Math.max(1,Math.round(b/1024))} KB`:`${(b/1048576).toFixed(1).replace(".",",")} MB`;
async function katDateiAufnehmen(el){
  const f=el.files[0]; el.value=""; const r=DB.katalog.get(nav.id); if(!f||!r) return;
  if(f.size>40*1048576){ toast("Datei ist größer als 40 MB"); return; }
  const id=uid(), ok=await dateiPut(id,{name:f.name,type:f.type,blob:f});
  if(!ok){ toast("Anhang konnte auf dem Gerät nicht gespeichert werden"); return; }
  r.anhaenge=[...(r.anhaenge||[]),{id,name:f.name,type:f.type,size:f.size,by:who(),at:Date.now()}]; saveRec("katalog",r); render();
  toast(SYNC_ON?"Angehängt – vorerst nur auf diesem Gerät":"Angehängt");
}
async function katDateiOeffnen(id){
  const o=await dateiGet(id); if(!o||!o.blob){ toast("Anhang liegt nicht auf diesem Gerät"); return; }
  const url=URL.createObjectURL(o.blob), w=window.open(url,"_blank"); if(!w) saveFile(o.blob,o.name); else setTimeout(()=>URL.revokeObjectURL(url),120000);
}

function katAnwenden(s,r){ if(!r) return; s.katId=r.id; s.typ=katVoll(r);

  if(r.phasen) s.phasen=+r.phasen; if(r.lps) s.lps=+r.lps; while(s.lp.length<2) s.lp.push(newLP());
  if(r.dc6){ const i=rcdInfo(s); setRcd(s,i.t,r.dc6==="ja"); }
  const kw=num(r.leistung); if(kw&&s.phasen){ const A=kw*1000/(s.phasen*230); if(Math.abs(A-16)<1.5) s.inenn="16"; else if(Math.abs(A-32)<2.5) s.inenn="32"; } }

function stErzeugen(liste,D){
  const neu=[];
  for(const g of D.gr){ const n=Math.max(0,Math.min(50,parseInt(g.n,10)||0)); if(!n) continue;
    const kg=g.kat&&DB.katalog.get(g.kat), typ=kg?katVoll(kg):g.typ;
    const vor=[...liste,...neu].reverse().find(x=>BAUART(x)===g.bauart&&(!typ||katNorm(x.typ)===katNorm(typ))), kat=kg||katZuTyp(typ);
    for(let i=0;i<n;i++){ const s=newSaeule(1,g.bauart); s.name="";
      if(vor){ [...ST_GERAET.filter(k=>k!=="fw"),...ST_TECHNIK].forEach(k=>{ if(vor[k]!==undefined) s[k]=vor[k]; }); }
      if(typ){ s.typ=typ.trim(); if(!vor) katAnwenden(s,kat); }
      neu.push(s); } }
  return neu;
}
function stAnlegen(){
  stLesen(); const D=stDlg; stDlg=null; closeOverlays();
  if(D.mode==="neu"){ const neu=stErzeugen([],D); if(!neu.length) neu.push(newSaeule(1)); neuePruefung(D.k,D.s,D.l,{stationen:neu}); return; }
  const start=cur.s.length, neu=stErzeugen(cur.s,D); if(!neu.length) return;
  cur.s.push(...neu); nummeriere(); commit();
  if(neu.length===1){ go({v:"saeule",si:start,st:"geraet"}); toast(`${cur.s[start].name} angelegt`); }
  else { go({v:"saeulen"}); toast(`${neu.length} Ladestationen angelegt`); }
}

function neuePruefung(kundeId,standortId,ladeparkId,st){
  const prev0=pruefAt(standortId,ladeparkId||null)[0];
  if(!prev0&&!st){ stDialog({mode:"neu",k:kundeId,s:standortId,l:ladeparkId}); return; }
  const p=newProto();
  if(st){ p.s=st.stationen; nummeriere(p.s); } p.kundeId=kundeId; p.standortId=standortId; p.ladeparkId=ladeparkId||null; p.p.pruefer=who().name;
  const meine=live("pruefungen").filter(x=>!SYNC_ON||sameUser(x.createdBy,ME)).sort((a,b)=>(b.created||0)-(a.created||0))[0];
  if(meine) ["geraet","geraetSn","kal","adapter"].forEach(f=>p.p[f]=meine.p[f]);
  const prev=pruefAt(standortId,ladeparkId||null)[0];
  if(prev){ p.s=JSON.parse(JSON.stringify(prev.s)).map(s=>Object.assign(s,{id:uid(),lp:s.lp.map(()=>newLP()),fotos:{}}));
    p.p.art="Wiederholungsprüfung"; ["netz","standort","umfang"].forEach(f=>p.p[f]=prev.p[f]); p.p.normen=[...prev.p.normen]; p.a.funktion=prev.a.funktion;
    if(prev.a.fristJ){ p.a.fristJ=prev.a.fristJ; const d=new Date(p.p.datum+"T12:00:00"); d.setFullYear(d.getFullYear()+(+p.a.fristJ)); p.a.naechste=d.toISOString().slice(0,10); } }
  saveRec("pruefungen",p,true); cur=JSON.parse(JSON.stringify(p)); dirtyCur=false;
  go({v:"projekt"}); toast(prev?`${p.s.length} ${p.s.length>1?"Ladestationen":"Ladestation"} aus der Prüfung vom ${deDate(prev.p.datum)} übernommen`:"Neue Prüfung angelegt");
}
function oeffne(id){ const p=DB.pruefungen.get(id); if(!p||p.deleted) return; cur=JSON.parse(JSON.stringify(p)); dirtyCur=false; setSub(SYNC_ON?"Abgeglichen":"Gespeichert auf diesem Gerät");
  fotoFetch(cur.s.flatMap(fotoIds)); go({v:"saeulen"}); }
function zurueck(){
  saveNow();
  if(nav.v==="saeule"){ go({v:"saeulen"}); return; }
  if(EDITOR.includes(nav.v)){ const back=cur.ladeparkId&&ladeparkOf(cur.ladeparkId)?{v:"ladepark",id:cur.ladeparkId}:standortOf(cur.standortId)?{v:"standort",id:cur.standortId}:{v:"start"}; cur=null; go(back); return; }
  if(nav.v==="ladepark"){ const l=ladeparkOf(nav.id); go(l?{v:"standort",id:l.standortId}:{v:"kunden"}); return; }
  if(nav.v==="standort"){ const s=standortOf(nav.id); go(s?{v:"kunde",id:s.kundeId}:{v:"kunden"}); return; }
  if(nav.v==="kunde"){ go({v:"kunden"}); return; }
  if(MEHR_SUB[nav.v]){ go({v:"mehr"}); return; }
  if(nav.v==="katmodell"){ go({v:"katalog"}); return; }
  if(nav.v==="katalog"){ go({v:"mehr"}); return; }
  go({v:"start"});
}

let swipe=null, swipe_block=0;
document.addEventListener("pointerdown",e=>{ const sw=e.target.closest(".sw"); if(!sw||e.target.closest(".pin")) return; if(sw.dataset.si!==undefined&&!canEdit(cur)) return;
  swipe={sw,li:sw.querySelector(".li"),x:e.clientX,y:e.clientY,dx:0,on:false}; });
document.addEventListener("pointermove",e=>{ if(!swipe) return; const dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
  if(!swipe.on){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ swipe=null; return; } if(Math.abs(dx)<12) return; swipe.on=true; swipe.sw.classList.add("drag"); }
  swipe.dx=dx; swipe.li.style.transform=`translateX(${dx}px)`; swipe.sw.classList.toggle("to-r",dx>0); swipe.sw.classList.toggle("to-l",dx<0); });
function swipeEnd(){ if(!swipe) return; const {sw,li,dx,on}=swipe; swipe=null; if(!on) return;
  sw.classList.remove("drag"); swipe_block=Date.now();
  const kind=sw.dataset.kind, far=Math.abs(dx)>sw.offsetWidth*0.35;
  if(sw.dataset.si!==undefined){
    if(far&&dx<0&&canEdit(cur)){ li.style.transform="translateX(-110%)"; setTimeout(()=>saeuleEntfernen(+sw.dataset.si),180); }
    else{ li.style.transform=""; setTimeout(()=>sw.classList.remove("to-r","to-l"),220); }
    return; }
  if(kind&&far){ li.style.transform=""; setTimeout(()=>sw.classList.remove("to-r","to-l"),220);
    if(dx>0){ const id=sw.dataset.id, i=META.pins.indexOf(id); if(i>=0) META.pins.splice(i,1); else META.pins.push(id); metaSave(); softRender(); toast(i<0?"Angepinnt – steht jetzt auf der Startseite":"Nicht mehr angepinnt"); }
    else locLoeschenFragen(kind,sw.dataset.id);
    return; }
  const p=DB.pruefungen.get(sw.dataset.id);
  if(far&&!(dx<0&&!canEdit(p))){ li.style.transform=`translateX(${dx>0?"":"-"}110%)`; setTimeout(()=>swipeAction(sw.dataset.id,dx>0?"arch":"del"),180); }
  else{ li.style.transform=""; setTimeout(()=>sw.classList.remove("to-r","to-l"),220); if(dx<0&&Math.abs(dx)>sw.offsetWidth*0.35) toast("Löschen darf nur der Ersteller oder ein Admin"); } }
document.addEventListener("pointerup",swipeEnd); document.addEventListener("pointercancel",swipeEnd);
document.addEventListener("click",e=>{ if(Date.now()-swipe_block<400&&e.target.closest(".sw")){ e.stopPropagation(); e.preventDefault(); } },true);
function archToggle(id){ const i=META.archiv.indexOf(id); if(i>=0) META.archiv.splice(i,1); else META.archiv.push(id); metaSave(); return i<0; }
function swipeAction(id,what){
  const p=DB.pruefungen.get(id); if(!p) return;
  if(what==="arch"){ const now=archToggle(id); softRender(); toast(now?"Archiviert":"Zurückgeholt","Rückgängig",()=>{ archToggle(id); softRender(); }); return; }
  loeschePruefung(p);
}
function unterbau(kind,id){
  const S=kind==="kunden"?standorteVon(id):kind==="standorte"?[standortOf(id)]:[];
  const L=kind==="ladeparks"?[ladeparkOf(id)]:S.flatMap(s=>ladeparksVon(s.id));
  const P=kind==="ladeparks"?pruefUnter("ladeparks",id):kind==="standorte"?pruefUnter("standorte",id):pruefUnter("kunden",id);
  return {S:kind==="standorte"?[]:S, L:kind==="ladeparks"?[]:L, P};
}
let delZiel=null;
function locLoeschenFragen(kind,id){
  const r=DB[kind].get(id); if(!r) return; const {S,L,P}=unterbau(kind,id);
  const fremd=P.filter(p=>!canEdit(p)).length+S.filter(x=>!canEdit(x)).length+L.filter(x=>!canEdit(x)).length;
  if(!canEdit(r)||fremd){ toast("Enthält Einträge anderer Mitarbeiter – löschen darf nur ein Admin"); return; }
  const teile=[S.length&&`${S.length} Standort${S.length>1?"en":""}`,L.length&&`${L.length} Ladepark${L.length>1?"s":""}`,P.length&&`${P.length} Prüfung${P.length>1?"en":""}`].filter(Boolean);
  delZiel={kind,id};
  confirmDlg(`${KIND_NAME[kind]} löschen?`,`„${r.name}“${teile.length?" mit "+teile.join(", ").replace(/, ([^,]*)$/," und $1"):""} wird gelöscht.${SYNC_ON?" Bereits abgelegte PDFs in der Share bleiben erhalten.":""}`,"Löschen","delLoc");
}
function locLoeschen(kind,id){
  const r=DB[kind].get(id), {S,L,P}=unterbau(kind,id), alle=[[kind,r],...S.map(x=>["standorte",x]),...L.map(x=>["ladeparks",x]),...P.map(x=>["pruefungen",x])];
  alle.forEach(([k,x])=>{ x.deleted=true; saveRec(k,x); });
  if(cur&&P.some(p=>p.id===cur.id)) cur=null;
  softRender();
  toast(`${r.name} gelöscht`,"Rückgängig",()=>{ alle.forEach(([k,x])=>{ x.deleted=false; saveRec(k,x); }); softRender(); });
}
function nummeriere(arr){ const n={}; (arr||cur.s).forEach(s=>{ const b=BAUART(s); n[b]=(n[b]||0)+1; if(!s.name||/^(Ladesäule|Wallbox) \d+$/.test(s.name)) s.name=`${b} ${n[b]}`; }); }
function saeuleEntfernen(si){
  if(!cur||!cur.s[si]) return;
  const vorher=JSON.parse(JSON.stringify(cur.s)), name=cur.s[si].name;
  cur.s.splice(si,1); if(!cur.s.length) cur.s.push(newSaeule(1)); nummeriere(); commit(); softRender();
  toast(`${name} entfernt`,"Rückgängig",()=>{ if(!cur) return; cur.s=vorher; commit(); softRender(); });
}
function loeschePruefung(p){
  p.deleted=true; saveRec("pruefungen",p); if(cur&&cur.id===p.id) cur=null; softRender();
  toast("Prüfung gelöscht","Rückgängig",()=>{ p.deleted=false; saveRec("pruefungen",p); softRender(); });
}

function refresh(){
  if(nav.v!=="saeule") return;
  const s=cur.s[nav.si], st=nav.st||"geraet";
  if(st.startsWith("lp")){
    const li=+st.slice(2);
    document.querySelectorAll("[data-dot]").forEach(d=>{ const k=d.dataset.dot.split(".").pop(), r=ROWS.find(x=>x.k===k); d.dataset.state=evalRow(r,getPath(d.dataset.dot),s); });
    document.querySelectorAll("[data-soll]").forEach(e=>{ const r=ROWS.find(x=>x.k===e.dataset.soll); e.textContent=sollOf(r,s); });
    GROUPS.forEach(g=>{ const e=document.querySelector(`[data-gres="${g.id}"]`); if(e){ const r=groupState(g,s,li); e.className=`pill ${r}`; e.textContent=RES_SHORT[r]; } });
  }
  for(let i=0;i<s.lps;i++){ const e=document.querySelector(`[data-lpres="lp${i}"]`); if(e) e.className=`sd ${lpState(s,i)}`; }
}

const snNorm=v=>String(v||"").replace(/[\s\-./]/g,"").toUpperCase();
function snDoppelt(p,si){ const n=snNorm(p.s[si].sn); if(!n) return []; return p.s.map((x,i)=>i!==si&&snNorm(x.sn)===n?sName(x,i):null).filter(Boolean); }
const snWarnHtml=(p,si)=>{ const d=snDoppelt(p,si); return d.length?`<p class="warnline">${icon("warn")}Seriennummer kommt auch bei ${esc(d.join(", "))} vor.</p>`:""; };
function kalBis(t){ t=String(t||"").trim(); let m;
  if((m=t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) return new Date(+m[3],+m[2]-1,+m[1]);
  if((m=t.match(/^(\d{1,2})[./](\d{4})$/))) return new Date(+m[2],+m[1],0);
  if((m=t.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/))) return m[3]?new Date(+m[1],+m[2]-1,+m[3]):new Date(+m[1],+m[2],0);
  return null; }
function kalStatus(p){ const raw=p.p.kal; if(!raw) return {s:"leer",t:"Kalibrierdatum des Messgeräts nicht eingetragen."};
  const bis=kalBis(raw); if(!bis) return {s:"form",t:"Kalibrierdatum nicht erkannt – bitte als MM.JJJJ eintragen."};
  const tag=new Date((p.p.datum||today())+"T12:00:00"), rest=Math.floor((bis-tag)/864e5);
  if(rest<0) return {s:"ab",t:`Kalibrierung abgelaufen (gültig bis ${raw}) – Messungen damit sind nicht nachweissicher.`};
  if(rest<=30) return {s:"bald",t:`Kalibrierung läuft in ${rest} Tag${rest===1?"":"en"} ab – Gerät rechtzeitig einschicken.`};
  return {s:"ok",t:""}; }
const kalWarnHtml=p=>{ const k=kalStatus(p); return k.s==="ok"||k.s==="leer"?"":`<p class="warnline${k.s==="bald"?" mild":""}">${icon("warn")}${esc(k.t)}</p>`; };
function pdfPruefung(p){
  const out=[], ohne=p.a.pdfOhne||[], S=p.s.map((s,i)=>({s,i})).filter(x=>!ohne.includes(x.s.id));
  const offen=[]; let bad=false;
  S.forEach(({s,i})=>{ for(let l=0;l<s.lps;l++){ const st=lpState(s,l); if(st==="bad") bad=true; if(st==="open"||st==="wip") offen.push(`${sName(s,i)}${s.lps>1?` Ladepunkt ${l+1}`:""}`); } });
  if(offen.length) out.push(`Noch nicht alle Werte erfasst: ${offen.slice(0,4).join(", ")}${offen.length>4?` und ${offen.length-4} weitere`:""}.`);
  if(bad&&!String(p.a.maengel||"").trim()) out.push("Nicht bestanden, aber keine Mängel / Maßnahmen eingetragen.");
  const dop=[]; S.forEach(({s,i})=>{ const d=snDoppelt(p,i); if(d.length&&!dop.some(x=>x.includes(sName(s,i)))) dop.push([sName(s,i),...d].join(" = ")); });
  if(dop.length) out.push(`Doppelte Seriennummer: ${dop.join("; ")}.`);
  const fehltSn=S.filter(({s})=>!String(s.sn||"").trim()).length; if(fehltSn) out.push(`Seriennummer fehlt bei ${fehltSn} Station${fehltSn>1?"en":""}.`);
  const k=kalStatus(p); if(k.s!=="ok") out.push(k.t);
  if(!p.a.sigP) out.push("Unterschrift Prüfer fehlt.");
  if(!p.a.sigK&&!p.a.kAbwesend) out.push("Unterschrift Auftraggeber fehlt (oder „nicht anwesend“ wählen).");
  if(!p.a.naechste) out.push("Nächste Prüfung nicht festgelegt.");
  return out;
}

function setupSigs(){
  ["sigP","sigK"].forEach(k=>{
    const c=$("#"+k); if(!c) return;
    const dpr=window.devicePixelRatio||1, rc=c.getBoundingClientRect();
    c.width=Math.round(rc.width*dpr); c.height=Math.round(rc.height*dpr);
    const x=c.getContext("2d"); x.lineWidth=2.4*dpr; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle=getComputedStyle(document.body).color;
    if(cur.a[k]){ const img=new Image(); img.onload=()=>{ const r=Math.min(c.width/img.width,c.height/img.height); x.drawImage(img,0,0,img.width*r,img.height*r); }; img.src=cur.a[k]; }
    let on=false,last=null; const pos=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]; };
    c.addEventListener("pointerdown",e=>{ on=true; last=pos(e); c.setPointerCapture(e.pointerId); e.preventDefault(); });
    c.addEventListener("pointermove",e=>{ if(!on) return; const p=pos(e); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last=p; });
    const end=()=>{ if(!on) return; on=false; cur.a[k]=sigExport(c); scheduleSave(); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
  });
}
