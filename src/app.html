<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Irrgang EVSE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FCFCFD">
<link rel="apple-touch-icon" href="<!--ICON-->">
<link rel="icon" href="<!--ICON-->">
<title>EVSE-Prüfprotokoll · Elektro Irrgang</title>
<style>
/* Material 3 mit Elektro-Irrgang-Farben (Rot #E11D2F, neutrale Grautöne), Schrift Manrope */
@font-face{font-family:"Manrope";font-weight:400;font-display:swap;src:url(data:font/woff2;base64,<!--F400-->) format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;font-display:swap;src:url(data:font/woff2;base64,<!--F600-->) format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-display:swap;src:url(data:font/woff2;base64,<!--F700-->) format("woff2")}
@font-face{font-family:"Manrope";font-weight:800;font-display:swap;src:url(data:font/woff2;base64,<!--F800-->) format("woff2")}
:root{
  --primary:#C8102E; --on-primary:#FFFFFF; --pc:#FFDAD8; --on-pc:#410006; --brand:#E11D2F;
  --sec-c:#F3DDDC; --on-sec-c:#2C1514;
  --surface:#FCFCFD; --sc-low:#F5F5F7; --sc:#EFF0F3; --sc-high:#E8E9ED; --sc-highest:#E1E2E7;
  --on-surface:#1F1F22; --on-sv:#4A4D55; --outline:#7A7D85; --outline-v:#C9CBD1;
  --ok:#1B7F45; --ok-c:#D3F0DD; --on-ok-c:#0B3A1E; --err:#BA1A1A; --err-c:#FFDAD6; --on-err-c:#410002;
  --fab:#E11D2F; --on-fab:#FFFFFF; --scrim:rgba(0,0,0,.32);
  --e1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15); --e3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#FFB3AE; --on-primary:#68000F; --pc:#930019; --on-pc:#FFDAD8; --sec-c:#5C3F3D; --on-sec-c:#FFDAD8;
  --surface:#131314; --sc-low:#1B1B1D; --sc:#1F1F21; --sc-high:#2A2A2C; --sc-highest:#353537;
  --on-surface:#E5E5E7; --on-sv:#C1C3C9; --outline:#8C8F96; --outline-v:#44464C;
  --ok:#7FD79E; --ok-c:#10391F; --on-ok-c:#B6F2C9; --err:#FFB4AB; --err-c:#93000A; --on-err-c:#FFDAD6;
  --fab:#C8102E; --on-fab:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#FFB3AE; --on-primary:#68000F; --pc:#930019; --on-pc:#FFDAD8; --sec-c:#5C3F3D; --on-sec-c:#FFDAD8;
  --surface:#131314; --sc-low:#1B1B1D; --sc:#1F1F21; --sc-high:#2A2A2C; --sc-highest:#353537;
  --on-surface:#E5E5E7; --on-sv:#C1C3C9; --outline:#8C8F96; --outline-v:#44464C;
  --ok:#7FD79E; --ok-c:#10391F; --on-ok-c:#B6F2C9; --err:#FFB4AB; --err-c:#93000A; --on-err-c:#FFDAD6;
  --fab:#C8102E; --on-fab:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Top App Bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);padding-top:env(safe-area-inset-top,0px);transition:background .2s}
.topbar.scrolled{background:var(--sc)}
.tb-row{display:flex;align-items:center;gap:4px;height:64px;padding:0 max(4px,env(safe-area-inset-right,0px)) 0 max(4px,env(safe-area-inset-left,0px))}
.tb-title{flex:1;min-width:0;margin:0 0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--on-sv);display:grid;place-items:center;flex:none;position:relative}
.icon-btn:hover,.icon-btn:active{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.logo{height:26px;width:auto;margin-left:12px;display:none}
body.is-list .logo.l-hell{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.is-list .logo.l-hell{display:none}:root:not([data-theme="light"]) body.is-list .logo.l-dunkel{display:block}}
:root[data-theme="dark"] body.is-list .logo.l-hell{display:none}
:root[data-theme="dark"] body.is-list .logo.l-dunkel{display:block}
body.is-list .tb-title{visibility:hidden}

/* Primary Tabs (nur in der Ladesäule) */
.tabs{display:flex;border-bottom:1px solid var(--outline-v)}
.tab{flex:1;max-width:200px;height:48px;border:0;background:transparent;color:var(--on-sv);font-weight:600;font-size:14px;display:flex;justify-content:center;position:relative}
.tab .tl{display:flex;align-items:center;gap:6px;height:100%;position:relative}
.tab[aria-selected="true"]{color:var(--primary)}
.tab[aria-selected="true"] .tl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--outline-v);display:inline-block}
.sd.ok{background:var(--ok)} .sd.bad{background:var(--err)}

/* Navigation Bar (Handy) / Navigation Rail (ab 840 px) */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--sc);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.nav-item{flex:1;height:80px;border:0;background:transparent;color:var(--on-sv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:.02em}
.nav-item .ind{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nav-item[aria-current="page"]{color:var(--on-surface)}
.nav-item[aria-current="page"] .ind{background:var(--sec-c);color:var(--on-sec-c)}
@media (min-width:840px){
  .navbar{top:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 80px) 0 0 env(safe-area-inset-left,0px);background:var(--surface);border-right:1px solid var(--outline-v)}
  .nav-item{flex:none;height:auto;padding:4px 0}
  .nav-item .ind{width:56px}
  body.has-nav .topbar, body.has-nav main{margin-left:88px}
}

/* Inhalt */
main{padding:8px max(16px,env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.has-nav main{padding-bottom:calc(184px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){main{padding-left:24px;padding-right:24px}}
@media (min-width:840px){body.has-nav main{padding-bottom:112px}}
.wrap{max-width:1040px;margin:0 auto}
.narrow{max-width:760px;margin:0 auto}
.hl{font-size:24px;font-weight:700;margin:8px 0 16px;letter-spacing:-.01em}
.meta{margin:0 0 12px;color:var(--on-sv);font-size:14px}
.cols{display:grid;gap:16px;align-items:start}
@media (min-width:1000px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--sc-low);border-radius:16px;padding:16px;min-width:0;--fbg:var(--sc-low)}
.card h3{font-size:16px;font-weight:700;margin:0 0 16px}
.fg{display:grid;gap:16px}
@media (min-width:600px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}.fg .full{grid-column:1/-1}}
.lbl{font-size:12px;font-weight:600;color:var(--on-sv);margin:0 0 6px 4px}
.sup{font-size:12px;color:var(--on-sv);margin:4px 16px 0}
.calc{font-size:12px;color:var(--on-sv);background:var(--sc-high);border-radius:8px;padding:8px 12px;margin:0;overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Outlined Text Field */
.tf{position:relative;min-width:0}
.tf input,.tf select,.tf textarea{display:block;width:100%;height:56px;border:0;border-radius:4px;background:transparent;box-shadow:inset 0 0 0 1px var(--outline);padding:16px;font-size:16px;color:var(--on-surface);-webkit-appearance:none;appearance:none}
.tf textarea{height:auto;min-height:112px;resize:vertical;line-height:1.45;padding-top:18px}
.tf select{padding-right:44px}
.tf input:focus,.tf select:focus,.tf textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--primary)}
.tf label{position:absolute;left:12px;top:16px;padding:0 4px;color:var(--on-sv);background:var(--fbg,var(--surface));pointer-events:none;font-size:16px;line-height:24px;transition:top .15s,font-size .15s,color .15s;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf :focus + label,.tf input:not(:placeholder-shown) + label,.tf textarea:not(:placeholder-shown) + label,.tf.fl label{top:-9px;font-size:12px;line-height:16px}
.tf :focus + label{color:var(--primary)}
.tf .sfx{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--on-sv);font-size:15px;pointer-events:none}
.tf.has-sfx input{padding-right:46px}
.tf .arr{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--on-sv);pointer-events:none}
.tf input[type="date"]{min-height:56px}

/* Chips & Segmented Buttons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;border-radius:8px;border:1px solid var(--outline);background:transparent;color:var(--on-sv);padding:0 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip .ic{width:18px;height:18px;display:none}
.chip[aria-pressed="true"]{background:var(--sec-c);border-color:var(--sec-c);color:var(--on-sec-c);padding-left:8px}
.chip[aria-pressed="true"] .ic{display:block}
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;height:40px;width:100%;max-width:320px}
.seg button{flex:1;border:0;border-left:1px solid var(--outline);background:transparent;color:var(--on-surface);font-size:14px;font-weight:600;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button .ic{width:18px;height:18px;display:none}
.seg button[aria-pressed="true"]{background:var(--sec-c);color:var(--on-sec-c)}
.seg button[aria-pressed="true"] .ic{display:block}
.seg.ev button[aria-pressed="true"][data-v="ok"]{background:var(--ok-c);color:var(--on-ok-c)}
.seg.ev button[aria-pressed="true"][data-v="nok"]{background:var(--err-c);color:var(--on-err-c)}

/* Status */
.pill{display:inline-flex;align-items:center;height:24px;border-radius:8px;padding:0 8px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.pill.ok{background:var(--ok-c);color:var(--on-ok-c)}
.pill.bad{background:var(--err-c);color:var(--on-err-c)}
.pill.open{background:var(--sc-highest);color:var(--on-sv)}

/* Listen */
.list{background:var(--sc-low);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:12px 16px;border:0;border-top:1px solid var(--outline-v);background:transparent;text-align:left;color:var(--on-surface);cursor:pointer}
.li:first-child,.sw:first-child .li{border-top:0}
.sec-lbl{font-size:13px;font-weight:700;color:var(--on-sv);margin:20px 4px 8px;letter-spacing:.02em}
.sec-lbl:first-of-type{margin-top:4px}
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw + .sw .li{border-top:1px solid var(--outline-v)}
.sw .li{position:relative;z-index:1;background:var(--sc-low);transition:transform .2s ease}
.sw.drag .li{transition:none}
.sw:not(.to-r):not(.to-l) .sw-bg{visibility:hidden}
.sw .li:hover,.sw .li:active{background:var(--sc-low);background-image:linear-gradient(color-mix(in srgb,var(--on-surface) 6%,transparent),color-mix(in srgb,var(--on-surface) 6%,transparent))}
.sw-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:700}
.sw-bg span{display:flex;align-items:center;gap:8px}
.sw.to-r .sw-bg{background:var(--sec-c);color:var(--on-sec-c)} .sw.to-r .sw-bg .r{visibility:hidden}
.sw.to-l .sw-bg{background:var(--err);color:#fff} .sw.to-l .sw-bg .l{visibility:hidden}
.pin{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--outline);display:grid;place-items:center;flex:none;margin-right:-8px}
.pin[aria-pressed="true"]{color:var(--primary)}
.lt .st{margin-top:6px}
.hint{font-size:12px;color:var(--on-sv);text-align:center;margin:12px 0 0}
.li:hover,.li:active{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.av{width:40px;height:40px;border-radius:50%;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;flex:none}
.lt{flex:1;min-width:0;display:flex;flex-direction:column}
.lt .h{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .s{font-size:14px;color:var(--on-sv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .lps{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.li > .ic{color:var(--on-sv)}
.empty{text-align:center;padding:64px 16px;color:var(--on-sv)}
.empty .ic{width:48px;height:48px;margin:0 auto 12px;color:var(--outline)}
.empty h2{font-size:22px;color:var(--on-surface);margin:0 0 8px}
.empty p{margin:0 auto 16px;max-width:380px}

/* Messzeilen */
.gh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.gh h3{margin:0}
.gh p{margin:2px 0 0;font-size:13px;color:var(--on-sv)}
.mrow{display:flex;align-items:center;gap:12px;min-height:72px;padding:8px 0;border-top:1px solid var(--outline-v)}
.gh + .mrow{border-top:0}
.mrow .txt{flex:1;min-width:0}
.mrow .l{font-size:15px;font-weight:600;line-height:1.3}
.mrow .s{font-size:13px;color:var(--on-sv);margin-top:2px;font-variant-numeric:tabular-nums}
.mrow .ctl{flex:none;width:132px}
.mrow .ctl.wide{width:168px}
.mrow .tf input,.mrow .tf select{height:48px;padding:12px;font-variant-numeric:tabular-nums}
.mrow .tf input{text-align:right;padding-right:42px}
.mrow .tf .sfx{right:12px;font-size:14px}
.mrow[data-state="ok"] .tf input,.mrow[data-state="ok"] .tf select{box-shadow:inset 0 0 0 2px var(--ok)}
.mrow[data-state="ok"] .sfx{color:var(--ok)}
.mrow[data-state="bad"] .tf input,.mrow[data-state="bad"] .tf select{box-shadow:inset 0 0 0 2px var(--err)}
.mrow[data-state="bad"] .sfx,.mrow[data-state="bad"] .s{color:var(--err)}
.mrow .seg{height:40px}
@media (max-width:380px){.mrow .ctl{width:116px}.mrow .ctl.wide{width:144px}.seg button{padding:0 8px}}

/* Abschluss */
.banner{display:flex;align-items:center;gap:16px;border-radius:16px;padding:16px;margin-bottom:16px}
.banner.ok{background:var(--ok-c);color:var(--on-ok-c)}
.banner.bad{background:var(--err-c);color:var(--on-err-c)}
.banner.open{background:var(--sc-high);color:var(--on-surface)}
.banner b{display:block;font-size:16px}
.banner span{font-size:14px;opacity:.85}
.sig + .sig{margin-top:20px}
.sig .bar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px 4px;font-size:12px;font-weight:600;color:var(--on-sv)}
canvas.pad{width:100%;height:168px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline-v);touch-action:none;display:block}
.btn-text{white-space:nowrap;height:40px;border:0;border-radius:20px;background:transparent;color:var(--primary);font-size:14px;font-weight:700;padding:0 12px}
.btn-text:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.btn-tonal{height:40px;border:0;border-radius:20px;background:var(--sec-c);color:var(--on-sec-c);font-size:14px;font-weight:700;padding:0 24px}

/* Extended FAB */
.fab{position:fixed;z-index:25;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:56px;border:0;border-radius:16px;background:var(--fab);color:var(--on-fab);display:flex;align-items:center;gap:12px;padding:0 20px 0 16px;font-size:15px;font-weight:700;box-shadow:var(--e3)}
body.has-nav .fab{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:840px){.fab{right:24px;bottom:24px!important}}

/* Menü, Dialog, Snackbar */
.scrim{position:fixed;inset:0;z-index:40;background:transparent}
.scrim.dim{background:var(--scrim)}
.menu{position:fixed;z-index:41;top:calc(env(safe-area-inset-top,0px) + 56px);right:max(8px,env(safe-area-inset-right,0px));min-width:224px;max-width:300px;background:var(--sc);border-radius:4px;box-shadow:var(--e3);padding:8px 0}
.mh{padding:4px 16px 8px;font-size:12px;color:var(--on-sv)}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:48px;border:0;background:transparent;padding:0 16px 0 12px;font-size:15px;font-weight:600;text-align:left;color:var(--on-surface)}
.mi .ic{color:var(--on-sv)}
.mi.danger,.mi.danger .ic{color:var(--err)}
.mi:hover,.mi:active{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.menu hr{border:0;border-top:1px solid var(--outline-v);margin:8px 0}
.dlg{position:fixed;z-index:42;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 48px));background:var(--sc-high);border-radius:28px;padding:24px;box-shadow:var(--e3)}
.dlg h2{margin:0 0 16px;font-size:24px;font-weight:700;line-height:1.3}
.dlg .db{color:var(--on-sv);font-size:15px}
.dlg .da{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.dlg .da .danger{color:var(--err)}
.dlg .dimg{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:12px;background:var(--sc)}
.cols > .wide{grid-column:1/-1}
.fotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:600px}
.foto{position:relative;aspect-ratio:3/4;border:1.5px dashed var(--outline);border-radius:12px;overflow:hidden;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--on-sv)}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto:not(.leer){border:0;background:var(--sc-high)}
.foto .fl{font-size:13px;font-weight:700;color:var(--on-surface);line-height:1.2}
.foto .fh{font-size:11px;text-align:center;padding:0 6px;line-height:1.25}
.foto:not(.leer) .fl{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;text-align:left}
.radio{display:flex;align-items:center;gap:16px;width:100%;height:48px;border:0;background:transparent;font-size:16px;color:var(--on-surface);padding:0 4px;text-align:left}
.radio .rb{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--on-sv);flex:none}
.radio[aria-checked="true"] .rb{box-shadow:inset 0 0 0 2px var(--primary),inset 0 0 0 5px var(--sc-high),inset 0 0 0 10px var(--primary)}
.snackbar{position:fixed;z-index:50;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin:0 auto;max-width:560px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--on-surface);color:var(--surface);padding:14px 16px;border-radius:4px;font-size:14px;box-shadow:var(--e3)}
body.has-nav .snackbar{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.snackbar{display:flex;align-items:center;gap:12px}
.snackbar span{flex:1}
.snackbar button{border:0;background:transparent;color:var(--pc);font-weight:700;font-size:14px;padding:6px 8px;border-radius:16px;white-space:nowrap}

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = s=>{ if(s==null) return NaN; const m=String(s).replace(",",".").replace(/[^0-9.\-]/g,""); return m===""?NaN:parseFloat(m); };

const today = ()=>new Date().toISOString().slice(0,10);
const deDate = iso=>iso?iso.split("-").reverse().join("."):"";

function newLP(){ return {v:{risov:"500 V"}, bem:""}; }
function newSaeule(n){ return {id:uid(), name:`Ladesäule ${n}`, typ:"", sn:"", ort:"", fw:"", absTyp:"LS B", absIn:"16", zsMan:"", inenn:"", rcd:RCD_TYPES[0], idn:"30", freigabe:"", phasen:3, lps:2, lp:[newLP(),newLP()], fotos:{}}; }
function newProto(){
  return {id:uid(), created:Date.now(), updated:Date.now(),

    s:[newSaeule(1)], a:{maengel:"", funktion:DEF_FUNKTION, naechste:"", sigP:"", sigK:"", sigPName:"", sigKName:""}};
}
function zsInfo(s){
  const In=num(s.absIn);
  if((s.absTyp==="LS B"||s.absTyp==="LS C")&&In>0){
    const f=s.absTyp==="LS B"?5:10, Ia=f*In, z=230/Ia, z23=z*2/3, r=Math.round(z23*100)/100;
    return {zul:r, calc:`${s.absTyp}${fmt(In)}: Ia = ${f} · ${fmt(In)} A = ${fmt(Ia)} A → 230 V / ${fmt(Ia)} A = ${fmt(z,6)} Ω → · 2/3 = ${fmt(z23,6)} Ω → ${fmt(r,2)} Ω`};
  }
  const m=num(s.zsMan);
  return {zul:isNaN(m)?NaN:m, calc:s.absTyp==="manuell"?"Zs zulässig aus der Sicherungstabelle eintragen.":"Nennstrom des LS eintragen."};
}
function sollOf(r,s){
  if(r.zs){ const z=zsInfo(s).zul; return isNaN(z)?"Zs zulässig fehlt":`≤ ${fmt(z,2)} Ω`; }
  if(r.ria){ const i=num(s.idn)||30; return `${fmt(0.5*i)} – ${fmt(i)} mA`; }
  return r.soll||"";
}
function rowVisible(r,s){ if(r.p3&&s.phasen===1) return false; if(r.dc&&!String(s.rcd).includes("RDC-DD")) return false; return true; }
function evalRow(r,val,s){
  if(val==null||val==="") return "open";
  if(r.type==="chk") return val==="ok"?"ok":val==="nok"?"bad":"open";
  if(r.type==="sel") return r.t?(r.t(val)?"ok":"bad"):"ok";
  const v=num(val); if(isNaN(v)) return "open";
  if(r.zs){ const z=zsInfo(s).zul; if(isNaN(z)) return "open"; return v<=z?"ok":"bad"; }
  if(r.ria){ const i=num(s.idn)||30; return (v>=0.5*i&&v<=i)?"ok":"bad"; }
  return r.t(v)?"ok":"bad";
}
function groupResult(g,s,li){ let o=0,b=0; for(const r of g.rows){ if(!rowVisible(r,s)) continue; const e=evalRow(r,s.lp[li].v[r.k],s); if(e==="bad")b++; else if(e==="open")o++; } return b?"bad":o?"open":"ok"; }
function lpResult(s,li){ const rs=GROUPS.map(g=>groupResult(g,s,li)); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }
function saeuleResult(s){ const rs=[]; for(let i=0;i<s.lps;i++) rs.push(lpResult(s,i)); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }
function protoResult(p){ const rs=p.s.map(saeuleResult); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }

const FOTO_SLOTS=[["ueb","Übersicht","von weiter weg"],["offen","Geöffnet","Anschlussraum"],["plak","Prüfplakette","gut lesbar"]];
const fotoCache=new Map(); let fotoDB=null, fotoTarget=null;
const fotoIds=s=>Object.values(s.fotos||{}).filter(Boolean);
function idbOpen(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(0); const r=indexedDB.open("evse_fotos",1); r.onupgradeneeded=()=>r.result.createObjectStore("f"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbAll(db){ return new Promise((res,rej)=>{ const out=[], rq=db.transaction("f").objectStore("f").openCursor(); rq.onsuccess=()=>{ const c=rq.result; if(c){ out.push([c.key,c.value]); c.continue(); } else res(out); }; rq.onerror=()=>rej(rq.error); }); }
function fotoPut(id,data){ fotoCache.set(id,data); if(!fotoDB) return Promise.resolve(false);
  return new Promise(res=>{ try{ const t=fotoDB.transaction("f","readwrite"); t.objectStore("f").put(data,id); t.oncomplete=()=>res(true); t.onerror=t.onabort=()=>res(false); }catch(e){ res(false); } }); }
function fotoDel(ids){ ids=ids.filter(Boolean); ids.forEach(i=>fotoCache.delete(i)); if(!fotoDB||!ids.length) return; try{ const t=fotoDB.transaction("f","readwrite"); ids.forEach(i=>t.objectStore("f").delete(i)); }catch(e){} }
async function fotoInit(){
  try{ fotoDB=await idbOpen(); const all=await idbAll(fotoDB);
    const used=new Set(protos.flatMap(p=>p.s.flatMap(fotoIds))); if(cur) cur.s.flatMap(fotoIds).forEach(i=>used.add(i));
    const orphan=[]; for(const [k,v] of all){ if(used.has(k)) fotoCache.set(k,v); else orphan.push(k); } fotoDel(orphan);
  }catch(e){ fotoDB=null; }
  if(nav.v==="saeule"){ const y=scrollY; render(); scrollTo(0,y); }
}
function fotoVerkleinern(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ const f=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*f); c.height=Math.round(img.naturalHeight*f); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.72)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(0); }; img.src=url; }); }
function saveFile(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); }

function tf(path,label,val,o={}){
  const cls=["tf"]; if(o.full) cls.push("full"); if(o.ph||o.type==="date") cls.push("fl"); if(o.sfx) cls.push("has-sfx");
  return `<div class="${cls.join(" ")}"><input id="${esc(path)}" data-bind="${esc(path)}" type="${o.type||"text"}" ${o.im?`inputmode="${o.im}"`:""} value="${esc(val)}" placeholder="${esc(o.ph||" ")}" autocomplete="off"><label for="${esc(path)}">${esc(label)}</label>${o.sfx?`<span class="sfx">${esc(o.sfx)}</span>`:""}</div>`;
}
function ta(path,label,val,o={}){
  return `<div class="tf${o.ph?" fl":""}${o.full?" full":""}"><textarea id="${esc(path)}" data-bind="${esc(path)}" placeholder="${esc(o.ph||" ")}">${esc(val)}</textarea><label for="${esc(path)}">${esc(label)}</label></div>`;
}
function sf(path,label,val,opts,o={}){
  return `<div class="tf fl${o.full?" full":""}"><select id="${esc(path)}" data-bind="${esc(path)}">${opts.map(x=>`<option value="${esc(x)}" ${x===val?"selected":""}>${esc(x||"–")}</option>`).join("")}</select><label for="${esc(path)}">${esc(label)}</label><span class="arr">${icon("drop")}</span></div>`;

let swipe=null;
document.addEventListener("pointerdown",e=>{ const sw=e.target.closest(".sw"); if(!sw||e.target.closest(".pin")) return;
  swipe={sw,li:sw.querySelector(".li"),x:e.clientX,y:e.clientY,dx:0,on:false}; });
document.addEventListener("pointermove",e=>{ if(!swipe) return; const dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
  if(!swipe.on){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ swipe=null; return; } if(Math.abs(dx)<12) return; swipe.on=true; swipe.sw.classList.add("drag"); }
  swipe.dx=dx; swipe.li.style.transform=`translateX(${dx}px)`; swipe.sw.classList.toggle("to-r",dx>0); swipe.sw.classList.toggle("to-l",dx<0); });
function swipeEnd(){ if(!swipe) return; const {sw,li,dx,on}=swipe; swipe=null; if(!on) return;
  sw.classList.remove("drag"); swipe_block=Date.now();
  if(Math.abs(dx)>sw.offsetWidth*0.35){ li.style.transform=`translateX(${dx>0?"":"-"}110%)`; setTimeout(()=>swipeAction(sw.dataset.id,dx>0?"arch":"del"),180); }
  else{ li.style.transform=""; setTimeout(()=>sw.classList.remove("to-r","to-l"),220); } }
let swipe_block=0;
document.addEventListener("pointerup",swipeEnd); document.addEventListener("pointercancel",swipeEnd);
document.addEventListener("click",e=>{ if(Date.now()-swipe_block<400&&e.target.closest(".sw")){ e.stopPropagation(); e.preventDefault(); } },true);
let undoDel=null;
function finishDel(){ if(!undoDel) return; clearTimeout(undoDel.t); fotoDel(undoDel.p.s.flatMap(fotoIds)); undoDel=null; }
function swipeAction(id,what){
  const i=protos.findIndex(p=>p.id===id); if(i<0) return; const p=protos[i];
  if(what==="arch"){ const was=!!p.archived; p.archived=!was; if(p.archived) p.pinned=false; lsSave(); render();
    toast(was?"Wiederhergestellt":"Archiviert","Rückgängig",()=>{ p.archived=was; lsSave(); render(); }); return; }
  finishDel(); protos.splice(i,1); lsSave(); render();
  undoDel={p,i,t:setTimeout(finishDel,6500)};
  toast("Protokoll gelöscht","Rückgängig",()=>{ if(!undoDel||undoDel.p!==p) return; clearTimeout(undoDel.t); protos.splice(Math.min(i,protos.length),0,p); undoDel=null; lsSave(); render(); });
}

const getPath=p=>p.split(".").reduce((o,k)=>o==null?o:o[k],cur);
function setPath(p,v){ const ks=p.split("."); let o=cur; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }
document.addEventListener("input",ev=>{
  const el=ev.target.closest("[data-bind]"); if(!el||!cur) return;
  const path=el.dataset.bind; setPath(path,el.value); scheduleSave();
  if(path==="p.projekt") $("#topTitle").textContent=cur.p.projekt||"Neues Protokoll";
  const m=path.match(/^s\.(\d+)\.(.+)$/); if(!m) return;
  const s=cur.s[+m[1]];
  if(m[2]==="name") $("#topTitle").textContent=sName(s,+m[1]);
  if(["absIn","zsMan"].includes(m[2])){ const c=$("#calc"); if(c) c.textContent=zsInfo(s).calc; }
  refresh();
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="importFile"){ importBackup(el); return; }
  if(el.id==="fotoFile"){ fotoAufnehmen(el); return; }
  if(!el.matches("select[data-bind]")||!cur) return;
  if(/^s\.\d+\.(absTyp|rcd)$/.test(el.dataset.bind)){ const y=scrollY; render(); scrollTo(0,y); } else refresh();
});
function refresh(){
  if(nav.v!=="saeule") return;
  const s=cur.s[nav.si], st=nav.st||"geraet";
  if(st.startsWith("lp")){
    const li=+st.slice(2);
    document.querySelectorAll("[data-dot]").forEach(d=>{ const k=d.dataset.dot.split(".").pop(), r=ROWS.find(x=>x.k===k); d.dataset.state=evalRow(r,getPath(d.dataset.dot),s); });
    document.querySelectorAll("[data-soll]").forEach(e=>{ const r=ROWS.find(x=>x.k===e.dataset.soll); e.textContent=sollOf(r,s); });
    GROUPS.forEach(g=>{ const e=document.querySelector(`[data-gres="${g.id}"]`); if(e){ const r=groupResult(g,s,li); e.className=`pill ${r}`; e.textContent=RES_SHORT[r]; } });
  }
  for(let i=0;i<s.lps;i++){ const e=document.querySelector(`[data-lpres="lp${i}"]`); if(e) e.className=`sd ${lpResult(s,i)}`; }
}

// ================= Aktionen =================
document.addEventListener("click",ev=>{
  const g=ev.target.closest("[data-go]"); if(g&&cur){ saveNow(); go({v:g.dataset.go}); return; }
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(b.closest("#menu")) closeOverlays();
  if(a==="menu"){ openMenu(); return; }
  if(a==="cancel"){ closeOverlays(); return; }
  if(a==="theme"){ dialog("Darstellung",THEMES.map(t=>`<button class="radio" role="radio" data-act="setTheme" data-v="${t}" aria-checked="${t===theme}"><span class="rb"></span>${TH_LABEL[t]}</button>`).join(""),`<button class="btn-text" data-act="cancel">Schließen</button>`); return; }
  if(a==="setTheme"){ theme=b.dataset.v; applyTheme(theme); closeOverlays(); if(nav.v==="abschluss") render(); return; }
  if(a==="new"){ cur=newProto(); saveNow(); go({v:"projekt"}); return; }

function setupSigs(){
  ["sigP","sigK"].forEach(k=>{
    const c=$("#"+k); if(!c) return;
    const dpr=window.devicePixelRatio||1, rc=c.getBoundingClientRect();
    c.width=Math.round(rc.width*dpr); c.height=Math.round(rc.height*dpr);
    const x=c.getContext("2d"); x.lineWidth=2.4*dpr; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle=getComputedStyle(document.body).color;
    if(cur.a[k]){ const img=new Image(); img.onload=()=>{ const r=Math.min(c.width/img.width,c.height/img.height); x.drawImage(img,0,0,img.width*r,img.height*r); }; img.src=cur.a[k]; }
    let on=false,last=null; const pos=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]; };
    c.addEventListener("pointerdown",e=>{ on=true; last=pos(e); c.setPointerCapture(e.pointerId); e.preventDefault(); });
    c.addEventListener("pointermove",e=>{ if(!on) return; const p=pos(e); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last=p; });
    const end=()=>{ if(!on) return; on=false; cur.a[k]=sigExport(c); scheduleSave(); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
  });
}
function sigExport(c){ const o=document.createElement("canvas"); o.width=Math.min(c.width,900); o.height=Math.round(c.height*o.width/c.width);
  const x=o.getContext("2d"); x.drawImage(c,0,0,o.width,o.height); const d=x.getImageData(0,0,o.width,o.height);
  for(let i=0;i<d.data.length;i+=4){ if(d.data[i+3]>0){ d.data[i]=20; d.data[i+1]=28; d.data[i+2]=40; } } x.putImageData(d,0,0); return o.toDataURL("image/png"); }
