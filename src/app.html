<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EVSE-Prüfung">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17324F">
<link rel="apple-touch-icon" href="<!--ICON-->">
<link rel="icon" href="<!--ICON-->">
<title>EVSE-Prüfprotokoll</title>
<style>
/* Werkzeug-Layout: feste Kopfzeile mit Reitern, Inhalte als Karten im Raster, Signalgelb nur für Hauptaktionen */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E6EAF0; --field:#F5F7FA; --ink:#15202C; --muted:#5B6878; --line:#D2D9E2;
  --bar:#17324F; --bar-ink:#FFFFFF; --bar-muted:#B9C9DB; --signal:#F2B705; --signal-ink:#1A1400; --link:#1F5FA6;
  --ok:#1E8A4B; --ok-bg:#E2F3E9; --bad:#C62828; --bad-bg:#FBE6E6; --open:#8A97A6;
  --shadow:0 1px 2px rgba(16,30,48,.06),0 2px 8px rgba(16,30,48,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#17202A; --sunk:#111922; --field:#0F171F; --ink:#E6ECF3; --muted:#93A1B1; --line:#2A3542;
  --bar:#0A131D; --bar-ink:#E6ECF3; --bar-muted:#8FA3B8; --signal:#F2B705; --signal-ink:#1A1400; --link:#7DB3F0;
  --ok:#4CC27E; --ok-bg:#15301F; --bad:#FF7B7B; --bad-bg:#3A1B1B; --open:#6E7C8C;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#17202A; --sunk:#111922; --field:#0F171F; --ink:#E6ECF3; --muted:#93A1B1; --line:#2A3542;
  --bar:#0A131D; --bar-ink:#E6ECF3; --bar-muted:#8FA3B8; --signal:#F2B705; --signal-ink:#1A1400; --link:#7DB3F0;
  --ok:#4CC27E; --ok-bg:#15301F; --bad:#FF7B7B; --bad-bg:#3A1B1B; --open:#6E7C8C;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}

/* Kopfzeile */
.appbar{position:sticky;top:0;z-index:30;background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px)}
.appbar .row{display:flex;align-items:center;gap:8px;min-height:56px}
.appbar .ttl{flex:1;min-width:0}
.appbar .ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl span{display:block;font-size:12px;color:var(--bar-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-btn{border:0;background:rgba(255,255,255,.1);color:var(--bar-ink);border-radius:9px;min-height:40px;padding:8px 12px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.ab-btn.signal{background:var(--signal);color:var(--signal-ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--bar-muted);border-radius:9px;padding:9px 14px;min-height:42px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:12px}
.tab[aria-current="page"]{background:rgba(255,255,255,.13);color:var(--bar-ink)}
.tab[aria-current="page"] .no{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}

main{padding-block:20px calc(40px + env(safe-area-inset-bottom,0px))}
h2.h{font-size:20px;font-weight:700;margin:0 0 4px;text-wrap:balance}
p.lead{margin:0 0 18px;color:var(--muted);font-size:15px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;margin:0 0 12px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.grid2 .full{grid-column:1/-1}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0;font-weight:500}
.i{width:100%;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:10px 12px;min-height:46px;font-size:16px;color:var(--ink)}
textarea.i{min-height:96px;resize:vertical;line-height:1.45}
.i:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 25%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-height:46px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.link{border-color:transparent;background:transparent;color:var(--link);padding-inline:8px}
.btn.small{min-height:38px;padding:7px 12px;font-size:14px}
.btn:focus-visible,.tab:focus-visible,.ab-btn:focus-visible,.seg button:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.nav-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;min-height:40px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink);border-color:var(--bar)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.open{background:var(--sunk);color:var(--muted)}
.note{font-size:13.5px;color:var(--muted)}
.calc{font-size:13px;color:var(--muted);font-family:var(--mono);background:var(--sunk);border-radius:8px;padding:9px 11px;overflow-x:auto;white-space:nowrap}

/* Liste + Kacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;box-shadow:var(--shadow);min-height:132px;color:var(--ink)}
.tile .t{font-weight:700;font-size:16px}
.tile .m{font-size:13.5px;color:var(--muted)}
.tile .bottom{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--link);font-weight:700;background:transparent;box-shadow:none}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--link);font-weight:600;padding:6px 0;cursor:pointer}

/* Messzeilen */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 128px 14px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow.chk{grid-template-columns:minmax(0,1fr) auto}
.mrow .l{font-weight:600;font-size:15px}
.mrow .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vin{display:flex;align-items:center;gap:6px}
.vin .i{min-height:42px;padding:8px 10px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.vin .u{font-size:13px;color:var(--muted);min-width:24px}
.dot{width:12px;height:12px;border-radius:50%;background:transparent;border:2px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--bad);border-color:var(--bad)}
.tri{display:flex;gap:6px}
.tri button{border:1px solid var(--line);background:var(--field);border-radius:9px;min-height:42px;min-width:64px;padding:6px 10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.tri button[aria-pressed="true"][data-v="ok"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tri button[aria-pressed="true"][data-v="nok"]{background:var(--bad);border-color:var(--bad);color:#fff}
.result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:12px;background:var(--sunk);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.sig{display:flex;flex-direction:column;gap:8px}
canvas.pad{width:100%;height:170px;background:var(--field);border:1.5px dashed var(--line);border-radius:10px;touch-action:none;display:block}
.sig .bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.summary .k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.summary .k b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.summary .k span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){main>.wrap{animation:fade .16s ease-out}@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="appbar">
  <div class="wrap gut">
    <div class="row">
      <button class="ab-btn" id="backBtn" hidden aria-label="Zur Protokoll-Liste">‹ Protokolle</button>
      <div class="ttl"><b id="topTitle">EVSE-Prüfprotokolle</b><span id="saveState">Wallbox- und Ladesäulenprüfung</span></div>
      <button class="ab-btn" id="themeBtn" title="Darstellung umschalten">Auto</button>
      <button class="ab-btn signal" id="pdfTop" hidden>PDF</button>
    </div>
    <nav class="tabs" id="tabs" hidden aria-label="Bereiche"></nav>
  </div>
</header>
<main class="gut"><div class="wrap" id="app"></div></main>
<div class="toast" id="toast" hidden role="status"></div>

<script><!--JSPDF--></script>
<script>
(() => {
"use strict";
// ================= Prüfpunkte =================
const GROUPS = [
  {id:"frei", t:"Spannungsfrei", sub:"Helfer: LS aus", rows:[
    {k:"rpe", l:"Schutzleiter", d:"Gehäuseschraube ↔ PE-Buchse FEV300", u:"Ω", soll:"≤ 0,3 Ω", t:v=>v<=0.3},
    {k:"riso", l:"Isolation", d:"L1+L2+L3+N gebrückt gegen PE", u:"MΩ", soll:"≥ 1 MΩ", t:v=>v>=1},
    {k:"risov", l:"Prüfspannung Isolation", type:"sel", opts:["500 V","250 V"], soll:"250 V bei Überspannungsschutz"},
  ]},
  {id:"spann", t:"Unter Spannung", sub:"FEV300 auf CP = C", rows:[
    {k:"pevt", l:"PE-Vortest (Touch)", type:"chk", soll:"keine Warnanzeige"},
    {k:"cp", l:"CP A → B → C", type:"chk", soll:"Box schaltet zu, LEDs an"},
    {k:"u1", l:"Spannung L1 – N", u:"V", soll:"207 – 253 V", t:v=>v>=207&&v<=253},
    {k:"u2", l:"Spannung L2 – N", u:"V", soll:"207 – 253 V", t:v=>v>=207&&v<=253, p3:true},
    {k:"u3", l:"Spannung L3 – N", u:"V", soll:"207 – 253 V", t:v=>v>=207&&v<=253, p3:true},
    {k:"unpe", l:"Spannung N – PE", u:"V", soll:"≈ 0 V (Richtwert < 10 V)", t:v=>v<10},
    {k:"dreh", l:"Drehfeld", type:"sel", opts:["rechts (123)","links (321)"], soll:"rechts", t:v=>v.startsWith("rechts"), p3:true},
    {k:"zs1", l:"Zs L1 – PE", d:"Mode std. RCD", u:"Ω", zs:true},
    {k:"zs2", l:"Zs L2 – PE", u:"Ω", zs:true, p3:true},
    {k:"zs3", l:"Zs L3 – PE", u:"Ω", zs:true, p3:true},
  ]},
  {id:"rcd", t:"RCD / DC-Fehlerstrom", sub:"CP = C", rows:[
    {k:"r05", l:"½ × IΔn", type:"chk", soll:"keine Auslösung"},
    {k:"r1", l:"1 × IΔn Auslösezeit", u:"ms", soll:"≤ 300 ms", t:v=>v<=300},
    {k:"r5", l:"5 × IΔn Auslösezeit", u:"ms", soll:"≤ 40 ms", t:v=>v<=40},
    {k:"ria", l:"Auslösestrom IΔ", u:"mA", ria:true},
    {k:"ub", l:"Berührungsspannung UB", u:"V", soll:"≤ 50 V", t:v=>v<=50},
    {k:"dc6", l:"6 mA DC (EVSE)", d:"Box muss abschalten", u:"s", soll:"≤ 10 s", t:v=>v<=10, dc:true},
  ]},
  {id:"fkt", t:"Funktion / Fehlersimulation", sub:"am FEV300", rows:[
    {k:"fe", l:"Taste E (CP – PE)", type:"chk", soll:"Ladung bricht ab"},
    {k:"ff", l:"Taste F (PE unterbrochen)", type:"chk", soll:"Ladung bricht ab"},
  ]},
];
const ROWS = GROUPS.flatMap(g=>g.rows);
const RCD_TYPES = ["A + RDC-DD 6 mA","A-EV","B","A (ohne DC-Erkennung)"];
const PRUEFARTEN = ["Erstprüfung","Erweiterung","Wiederholungsprüfung","nach Instandsetzung"];
const NORMEN = ["DIN VDE 0100-600","DIN VDE 0105-100","DIN VDE 0100-722","DGUV V3"];
const DEF_UMFANG = "Stromkreise der Ladeeinrichtungen ab Verteiler [Name] inkl. aller Ladepunkte. Prüfung nach DIN VDE 0100-722 mit Prüfadapter Fluke FEV300. Übrige elektrische Anlage nicht Bestandteil dieser Prüfung.";
const DEF_FUNKTION = "Funktionsprüfung mit Prüfadapter Fluke FEV300 durchgeführt. PE-Vortest ohne Befund. CP-Zustände A, B, C durchgeschaltet, Ladefreigabe in Zustand C erfolgt. Fehlersimulation CP-Fehler (E) und PE-Unterbrechung (F): Ladevorgang wurde jeweils abgebrochen.";
const RES_TXT = {ok:"bestanden", bad:"nicht bestanden", open:"offen"};
const RES_SHORT = {ok:"i.O.", bad:"n.i.O.", open:"offen"};

// ================= Hilfen =================
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = s=>{ if(s==null) return NaN; const m=String(s).replace(",",".").replace(/[^0-9.\-]/g,""); return m===""?NaN:parseFloat(m); };
const fmt = (v,d=3)=>Number(v).toLocaleString("de-DE",{maximumFractionDigits:d});
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = ()=>new Date().toISOString().slice(0,10);
const deDate = iso=>iso?iso.split("-").reverse().join("."):"";

function newLP(){ return {v:{risov:"500 V"}, bem:""}; }
function newSaeule(n){ return {id:uid(), name:`Ladesäule ${n}`, typ:"", sn:"", ort:"", fw:"", absTyp:"LS B", absIn:"16", zsMan:"", inenn:"", rcd:RCD_TYPES[0], idn:"30", freigabe:"", phasen:3, lps:2, lp:[newLP(),newLP()]}; }
function newProto(){
  return {id:uid(), created:Date.now(), updated:Date.now(),
    p:{projekt:"", auftraggeber:"", auftragsnr:"", standort:"", datum:today(), pruefer:"", geraet:"Wiha MFT one", geraetSn:"", kal:"", adapter:"Fluke FEV300", art:"Erstprüfung", normen:["DIN VDE 0100-600","DIN VDE 0100-722"], netz:"TN-C-S", umfang:DEF_UMFANG},
    s:[newSaeule(1)], a:{maengel:"", funktion:DEF_FUNKTION, naechste:"", sigP:"", sigK:"", sigPName:"", sigKName:""}};
}
function zsInfo(s){
  const In=num(s.absIn);
  if((s.absTyp==="LS B"||s.absTyp==="LS C")&&In>0){
    const f=s.absTyp==="LS B"?5:10, Ia=f*In, z=230/Ia, z23=z*2/3, r=Math.round(z23*100)/100;
    return {zul:r, calc:`${s.absTyp}${fmt(In)}: Ia = ${f} · ${fmt(In)} A = ${fmt(Ia)} A → 230 V / ${fmt(Ia)} A = ${fmt(z,6)} Ω → · 2/3 = ${fmt(z23,6)} Ω → ${fmt(r,2)} Ω`};
  }
  const m=num(s.zsMan);
  return {zul:isNaN(m)?NaN:m, calc:s.absTyp==="manuell"?"Zs zulässig aus der Sicherungstabelle eintragen.":"Nennstrom des LS eintragen."};
}
function sollOf(r,s){
  if(r.zs){ const z=zsInfo(s).zul; return isNaN(z)?"Zs zulässig fehlt":`≤ ${fmt(z,2)} Ω`; }
  if(r.ria){ const i=num(s.idn)||30; return `${fmt(0.5*i)} – ${fmt(i)} mA`; }
  return r.soll||"";
}
function rowVisible(r,s){ if(r.p3&&s.phasen===1) return false; if(r.dc&&!String(s.rcd).includes("RDC-DD")) return false; return true; }
function evalRow(r,val,s){
  if(val==null||val==="") return "open";
  if(r.type==="chk") return val==="ok"?"ok":val==="nok"?"bad":"open";
  if(r.type==="sel") return r.t?(r.t(val)?"ok":"bad"):"ok";
  const v=num(val); if(isNaN(v)) return "open";
  if(r.zs){ const z=zsInfo(s).zul; if(isNaN(z)) return "open"; return v<=z?"ok":"bad"; }
  if(r.ria){ const i=num(s.idn)||30; return (v>=0.5*i&&v<=i)?"ok":"bad"; }
  return r.t(v)?"ok":"bad";
}
function groupResult(g,s,li){ let o=0,b=0; for(const r of g.rows){ if(!rowVisible(r,s)) continue; const e=evalRow(r,s.lp[li].v[r.k],s); if(e==="bad")b++; else if(e==="open")o++; } return b?"bad":o?"open":"ok"; }
function lpResult(s,li){ const rs=GROUPS.map(g=>groupResult(g,s,li)); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }
function saeuleResult(s){ const rs=[]; for(let i=0;i<s.lps;i++) rs.push(lpResult(s,i)); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }
function protoResult(p){ const rs=p.s.map(saeuleResult); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }

// ================= Speicher (nur dieses Gerät) =================
const LS_KEY="evse_protos_v1", TH_KEY="evse_theme";
let protos=[], cur=null, nav={v:"list"}, saveTimer=null;
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ return []; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(protos)); return true; }catch(e){ return false; } }
function scheduleSave(){ if(!cur) return; cur.updated=Date.now(); setSub("Ungespeichert …"); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,900); }
function saveNow(){
  if(!cur) return; clearTimeout(saveTimer);
  const copy=JSON.parse(JSON.stringify(cur)); const i=protos.findIndex(p=>p.id===copy.id);
  if(i>=0) protos[i]=copy; else protos.unshift(copy);
  setSub(lsSave()?"Gespeichert auf diesem iPad":"Speicher voll – bitte „Alle sichern“");
}
function setSub(t){ $("#saveState").textContent=t; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2800); }
function saveFile(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); }

// ================= Darstellung =================
const THEMES=["auto","light","dark"], TH_LABEL={auto:"Auto",light:"Hell",dark:"Dunkel"};
function applyTheme(t){
  if(t==="auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t;
  $("#themeBtn").textContent=TH_LABEL[t];
  try{ localStorage.setItem(TH_KEY,t); }catch(e){}
  const dark = t==="dark" || (t==="auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark?"#0A131D":"#17324F");
}
let theme="auto"; try{ theme=localStorage.getItem(TH_KEY)||"auto"; }catch(e){}
applyTheme(theme);
$("#themeBtn").addEventListener("click",()=>{ theme=THEMES[(THEMES.indexOf(theme)+1)%3]; applyTheme(theme); });

// ================= Rendering =================
const PTABS=[["projekt","Projekt"],["saeulen","Ladesäulen"],["abschluss","Abschluss"]];
function go(n){ nav=n; render(); window.scrollTo(0,0); }
function render(){
  const app=$("#app"), inP=nav.v!=="list";
  $("#backBtn").hidden=!inP; $("#pdfTop").hidden=!inP; $("#tabs").hidden=!inP;
  if(!inP){ $("#topTitle").textContent="EVSE-Prüfprotokolle"; setSub("Wallbox- und Ladesäulenprüfung"); app.innerHTML=listView(); return; }
  $("#topTitle").textContent=cur.p.projekt||"Neues Protokoll";
  const active = nav.v==="saeule"?"saeulen":nav.v;
  $("#tabs").innerHTML=PTABS.map(([k,t],i)=>`<button class="tab" data-go="${k}" ${k===active?'aria-current="page"':""}><span class="no">${i+1}</span>${t}</button>`).join("");
  if(nav.v==="projekt") app.innerHTML=projektView();
  else if(nav.v==="saeulen") app.innerHTML=saeulenView();
  else if(nav.v==="saeule") app.innerHTML=saeuleView();
  else if(nav.v==="abschluss"){ app.innerHTML=abschlussView(); setupSigs(); }
}

function listView(){
  let h=`<div class="nav-foot" style="margin:0 0 16px"><div><h2 class="h">Protokolle</h2><p class="lead" style="margin:0">Auf diesem iPad gespeichert</p></div>
    <button class="btn primary" data-act="new">+ Neues Protokoll</button></div><div class="tiles">`;
  if(!protos.length) h+=`<div class="card empty"><b>Noch keine Protokolle</b>Tippe auf „+ Neues Protokoll“. Es startet mit einer Ladesäule mit zwei Ladepunkten.</div>`;
  for(const p of protos){
    const n=p.s.length, r=protoResult(p);
    h+=`<button class="tile" data-act="open" data-id="${esc(p.id)}"><span class="t">${esc(p.p.projekt||"Ohne Namen")}</span>
      <span class="m">${esc([p.p.auftraggeber,p.p.auftragsnr].filter(Boolean).join(" · ")||"–")}</span>
      <span class="m">${esc(deDate(p.p.datum))} · ${n} Ladesäule${n>1?"n":""}</span>
      <span class="bottom"><span class="pill ${r}">${RES_TXT[r]}</span></span></button>`;
  }
  h+=`</div>
  <div class="card" style="margin-top:28px"><h3>Sicherung</h3>
    <p class="note" style="margin:0 0 12px">Protokolle liegen nur auf diesem iPad. Sichere sie regelmäßig als Datei, z. B. in „Dateien“ oder per Mail. „Sicherung laden“ holt sie zurück oder auf ein anderes iPad.</p>
    <div class="chips"><button class="btn" data-act="export">Alle sichern</button>
    <label class="btn">Sicherung laden<input type="file" id="importFile" accept=".json,application/json" hidden></label></div></div>`;
  return h;
}
const inp=(path,val,o={})=>`<input class="i" id="${esc(path)}" data-bind="${esc(path)}" type="${o.type||"text"}" ${o.im?`inputmode="${o.im}"`:""} value="${esc(val)}" ${o.ph?`placeholder="${esc(o.ph)}"`:""} autocomplete="off">`;
const sel=(path,val,opts)=>`<select class="i" id="${esc(path)}" data-bind="${esc(path)}">${opts.map(o=>`<option value="${esc(o)}" ${o===val?"selected":""}>${esc(o||"–")}</option>`).join("")}</select>`;
const footNav=(back,next)=>`<div class="nav-foot"><span>${back?`<button class="btn" data-go="${back[0]}">‹ ${back[1]}</button>`:""}</span><span>${next?`<button class="btn primary" data-go="${next[0]}">${next[1]} ›</button>`:""}</span></div>`;

  const res=cur.s.map(saeuleResult);
  let h=`<h2 class="h">Ladesäulen</h2><p class="lead">Säule antippen zum Messen. Neue Säulen übernehmen Typ, Absicherung und RCD der letzten.</p>
  <div class="summary"><div class="k"><b>${cur.s.length}</b><span>Ladesäulen</span></div>
    <div class="k"><b style="color:var(--ok)">${res.filter(r=>r==="ok").length}</b><span>bestanden</span></div>
    <div class="k"><b style="color:${res.includes("bad")?"var(--bad)":"var(--muted)"}">${res.filter(r=>r==="bad").length}</b><span>mit Mängeln</span></div></div>
  <div class="tiles">`;
  cur.s.forEach((s,si)=>{
    h+=`<button class="tile" data-act="openS" data-si="${si}"><span class="t">${esc(s.name||`Ladesäule ${si+1}`)}</span>
      <span class="m">${esc([s.typ,s.ort].filter(Boolean).join(" · ")||"Gerätedaten fehlen")}</span>

function saeuleView(){
  const si=nav.si, s=cur.s[si]; if(!s){ nav={v:"saeulen"}; return saeulenView(); }
  const st=nav.st||"geraet", b=`s.${si}.`;
  const subs=[["geraet","Gerätedaten",null], ...Array.from({length:s.lps},(_,i)=>[`lp${i}`,`LP ${i+1} ${s.lps===2?(i?"rechts":"links"):""}`.trim(), lpResult(s,i)])];
  let h=`<div class="crumb"><button data-go="saeulen">Ladesäulen</button><span>›</span><span>${esc(s.name)}</span></div>
  <div class="nav-foot" style="margin:0 0 16px;align-items:flex-end"><div><h2 class="h" id="sName">${esc(s.name||`Ladesäule ${si+1}`)}</h2><p class="lead" style="margin:0" id="sSub">${esc([s.typ,s.ort].filter(Boolean).join(" · ")||"Gerätedaten eintragen")}</p></div>
    <span class="pill ${saeuleResult(s)}" id="sRes">${RES_TXT[saeuleResult(s)]}</span></div>
  <div class="seg" style="margin-bottom:16px">${subs.map(([k,t,r])=>`<button type="button" data-act="sub" data-v="${k}" aria-pressed="${st===k}">${esc(t)}${r?` <span class="pill ${r}" data-lpres="${k}" style="margin-left:4px">${RES_SHORT[r]}</span>`:""}</button>`).join("")}</div>`;
  if(st==="geraet"){
    const z=zsInfo(s);
    h+=`<div class="cols">
      <div class="card"><h3>Gerät</h3><div class="grid2">
        <label class="f">Bezeichnung ${inp(b+"name",s.name)}</label>
        <label class="f">Standort / Stellplatz ${inp(b+"ort",s.ort)}</label>
        <label class="f">Hersteller / Typ ${inp(b+"typ",s.typ)}</label>
        <label class="f">Seriennummer ${inp(b+"sn",s.sn)}</label>
        <label class="f">Firmware ${inp(b+"fw",s.fw)}</label>
        <label class="f">Freigabe ${inp(b+"freigabe",s.freigabe,{ph:"Ladekarte / App / frei"})}</label>
        <div class="f full">Ladepunkte<div class="seg"><button type="button" data-act="lps" data-v="1" aria-pressed="${s.lps===1}">1 Ladepunkt</button><button type="button" data-act="lps" data-v="2" aria-pressed="${s.lps===2}">2 Ladepunkte</button></div></div>
        <div class="f full">Anschluss<div class="seg"><button type="button" data-act="phasen" data-v="3" aria-pressed="${s.phasen===3}">3-phasig</button><button type="button" data-act="phasen" data-v="1" aria-pressed="${s.phasen===1}">1-phasig</button></div></div>
      </div></div>
      <div class="card"><h3>Schutzeinrichtungen</h3><div class="grid2">
        <label class="f">Absicherung ${sel(b+"absTyp",s.absTyp,["LS B","LS C","manuell"])}</label>
        ${s.absTyp==="manuell"?`<label class="f">Zs zulässig (Ω) ${inp(b+"zsMan",s.zsMan,{im:"decimal",ph:"aus Tabelle"})}</label>`:`<label class="f">Nennstrom LS (A) ${inp(b+"absIn",s.absIn,{im:"decimal"})}</label>`}
        <div class="calc full" id="calc">${esc(z.calc)}</div>
        <label class="f">RCD-Typ ${sel(b+"rcd",s.rcd,RCD_TYPES)}</label>
        <label class="f">RCD IΔn (mA) ${inp(b+"idn",s.idn,{im:"numeric"})}</label>
        <label class="f">Nennstrom je Ladepunkt (A) ${inp(b+"inenn",s.inenn,{im:"decimal"})}</label>
      </div></div>
    </div>
    <div class="nav-foot"><span id="delZone"><button class="btn link" data-act="delSask" style="color:var(--bad)">Ladesäule entfernen</button></span>
      <button class="btn primary" data-act="sub" data-v="lp0">Weiter zu LP 1 ›</button></div>`;
    return h;
  }
  const li=+st.slice(2), lp=s.lp[li], lb=`${b}lp.${li}.`;
  h+=`<div class="cols">`;
  for(const g of GROUPS){
    const rows=g.rows.filter(r=>rowVisible(r,s)); if(!rows.length) continue;
    const gr=groupResult(g,s,li);
    h+=`<div class="card"><div class="nav-foot" style="margin:0 0 6px"><h3 style="margin:0">${esc(g.t)} <span class="note" style="font-weight:500">· ${esc(g.sub)}</span></h3><span class="pill ${gr}" data-gres="${g.id}">${RES_SHORT[gr]}</span></div>`;
    for(const r of rows){
      const val=lp.v[r.k]??"", e=evalRow(r,val,s), path=`${lb}v.${r.k}`;
      const lab=`<div><div class="l">${esc(r.l)}</div><div class="s"><span data-soll="${r.k}">${esc(sollOf(r,s))}</span>${r.d?` · ${esc(r.d)}`:""}</div></div>`;
      if(r.type==="chk") h+=`<div class="mrow chk">${lab}<div class="tri">${[["ok","i.O."],["nok","n.i.O."]].map(([v,t])=>`<button type="button" data-act="chk" data-path="${path}" data-v="${v}" aria-pressed="${val===v}">${t}</button>`).join("")}</div></div>`;
      else if(r.type==="sel") h+=`<div class="mrow">${lab}<select class="i" id="${path}" data-bind="${path}" style="min-height:42px;padding:8px">${["",...r.opts].map(o=>`<option value="${esc(o)}" ${o===val?"selected":""}>${o?esc(o):"–"}</option>`).join("")}</select><span class="dot ${e}" data-dot="${path}"></span></div>`;
      else h+=`<div class="mrow">${lab}<div class="vin"><input class="i" id="${path}" data-bind="${path}" inputmode="decimal" value="${esc(val)}" autocomplete="off" aria-label="${esc(r.l)} in ${esc(r.u)}"><span class="u">${esc(r.u)}</span></div><span class="dot ${e}" data-dot="${path}"></span></div>`;
    }
    h+=`</div>`;
  }
  const lr=lpResult(s,li);
  h+=`<div class="card"><h3>Bemerkung LP ${li+1}</h3><textarea class="i" id="${lb}bem" data-bind="${lb}bem" placeholder="z. B. Freigabe per Ladekarte nötig">${esc(lp.bem)}</textarea></div></div>
  <div class="result" style="margin-top:16px"><span>Ergebnis Ladepunkt ${li+1}</span><span class="pill ${lr}" id="lpRes">${RES_TXT[lr]}</span></div>`;
  const next = li+1<s.lps ? `<button class="btn primary" data-act="sub" data-v="lp${li+1}">Weiter zu LP ${li+2} ›</button>` :
    (si+1<cur.s.length ? `<button class="btn primary" data-act="openS" data-si="${si+1}">Weiter zu ${esc(cur.s[si+1].name)} ›</button>` : `<button class="btn primary" data-go="saeulen">Fertig – zur Übersicht ›</button>`);
  h+=`<div class="nav-foot"><button class="btn" data-act="sub" data-v="${li?`lp${li-1}`:"geraet"}">‹ ${li?`LP ${li}`:"Gerätedaten"}</button>${next}</div>`;
  return h;
}

// ================= Eingaben =================
const getPath=p=>p.split(".").reduce((o,k)=>o==null?o:o[k],cur);
function setPath(p,v){ const ks=p.split("."); let o=cur; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }
document.addEventListener("input",ev=>{
  const el=ev.target.closest("[data-bind]"); if(!el||!cur) return;
  const path=el.dataset.bind; setPath(path,el.value); scheduleSave();
  if(path==="p.projekt") $("#topTitle").textContent=cur.p.projekt||"Neues Protokoll";
  const m=path.match(/^s\.(\d+)\.(.+)$/); if(!m) return;
  const s=cur.s[+m[1]];
  if(["name","typ","ort"].includes(m[2])){ const n=$("#sName"), su=$("#sSub"); if(n) n.textContent=s.name||"Ladesäule"; if(su) su.textContent=[s.typ,s.ort].filter(Boolean).join(" · ")||"Gerätedaten eintragen"; }
  if(["absIn","zsMan"].includes(m[2])){ const c=$("#calc"); if(c) c.textContent=zsInfo(s).calc; }
  refresh();
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="importFile"){ importBackup(el); return; }
  if(!el.matches("select[data-bind]")||!cur) return;
  if(/^s\.\d+\.(absTyp|rcd)$/.test(el.dataset.bind)){ const y=scrollY; render(); scrollTo(0,y); } else refresh();
});
function refresh(){
  if(nav.v!=="saeule") return;
  const s=cur.s[nav.si]; const st=nav.st||"geraet";
  if(st.startsWith("lp")){
    const li=+st.slice(2);
    document.querySelectorAll("[data-dot]").forEach(d=>{ const k=d.dataset.dot.split(".").pop(), r=ROWS.find(x=>x.k===k); d.className=`dot ${evalRow(r,getPath(d.dataset.dot),s)}`; });
    document.querySelectorAll("[data-soll]").forEach(e=>{ const r=ROWS.find(x=>x.k===e.dataset.soll); e.textContent=sollOf(r,s); });
    GROUPS.forEach(g=>{ const e=document.querySelector(`[data-gres="${g.id}"]`); if(e){ const r=groupResult(g,s,li); e.className=`pill ${r}`; e.textContent=RES_SHORT[r]; } });
    const lr=$("#lpRes"); if(lr){ const r=lpResult(s,li); lr.className=`pill ${r}`; lr.textContent=RES_TXT[r]; }
  }
  for(let i=0;i<s.lps;i++){ const e=document.querySelector(`[data-lpres="lp${i}"]`); if(e){ const r=lpResult(s,i); e.className=`pill ${r}`; e.textContent=RES_SHORT[r]; } }
  const sr=$("#sRes"); if(sr){ const r=saeuleResult(s); sr.className=`pill ${r}`; sr.textContent=RES_TXT[r]; }
}

// ================= Aktionen =================
document.addEventListener("click",ev=>{
  const g=ev.target.closest("[data-go]"); if(g&&cur){ saveNow(); go({v:g.dataset.go}); return; }
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="new"){ cur=newProto(); saveNow(); go({v:"projekt"}); return; }
  if(a==="open"){ const p=protos.find(x=>x.id===b.dataset.id); if(!p) return; cur=JSON.parse(JSON.stringify(p)); go({v:"saeulen"}); setSub("Gespeichert auf diesem iPad"); return; }
  if(a==="export"){ const blob=new Blob([JSON.stringify({app:"evse-pruefprotokoll",version:1,saved:Date.now(),protokolle:protos})],{type:"application/json"}); saveFile(blob,`EVSE-Protokolle_Sicherung_${today()}.json`); toast(`${protos.length} Protokoll(e) gesichert`); return; }
  if(!cur) return;
  if(a==="norm"){ const n=b.dataset.n, L=cur.p.normen, i=L.indexOf(n); if(i>=0) L.splice(i,1); else L.push(n); b.setAttribute("aria-pressed",i<0); scheduleSave(); return; }
  if(a==="openS"){ saveNow(); go({v:"saeule",si:+b.dataset.si,st:"geraet"}); return; }
  if(a==="addS"){ const prev=cur.s[cur.s.length-1], s=newSaeule(cur.s.length+1);
    if(prev) ["typ","absTyp","absIn","zsMan","rcd","idn","inenn","freigabe","phasen","lps"].forEach(k=>s[k]=prev[k]);
    cur.s.push(s); saveNow(); go({v:"saeule",si:cur.s.length-1,st:"geraet"}); toast(`${s.name} angelegt`); return; }
  if(a==="sub"){ saveNow(); go({...nav,st:b.dataset.v}); return; }
  if(a==="lps"||a==="phasen"){ const s=cur.s[nav.si]; s[a]=+b.dataset.v; while(s.lp.length<2) s.lp.push(newLP()); scheduleSave(); const y=scrollY; render(); scrollTo(0,y); return; }
  if(a==="chk"){ const p=b.dataset.path, v=b.dataset.v; setPath(p,getPath(p)===v?"":v); scheduleSave(); b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",getPath(p)===x.dataset.v)); refresh(); return; }
  if(a==="sigclear"){ cur.a[b.dataset.k]=""; scheduleSave(); const c=$("#"+b.dataset.k); c.getContext("2d").clearRect(0,0,c.width,c.height); return; }
  if(a==="delSask"){ $("#delZone").innerHTML=`<span class="confirm">Säule mit allen Werten entfernen? <button class="btn small danger" data-act="delS">Entfernen</button><button class="btn small" data-act="cancel">Abbrechen</button></span>`; return; }
  if(a==="delS"){ cur.s.splice(nav.si,1); if(!cur.s.length) cur.s.push(newSaeule(1)); saveNow(); go({v:"saeulen"}); toast("Ladesäule entfernt"); return; }
  if(a==="cancel"){ const y=scrollY; render(); scrollTo(0,y); return; }
  if(a==="delask"){ $("#delZone").innerHTML=`<span class="confirm">Ganzes Protokoll löschen? <button class="btn small danger" data-act="del">Löschen</button><button class="btn small" data-act="cancel">Abbrechen</button></span>`; return; }
  if(a==="del"){ const id=cur.id; clearTimeout(saveTimer); protos=protos.filter(p=>p.id!==id); lsSave(); cur=null; go({v:"list"}); toast("Protokoll gelöscht"); return; }
  if(a==="dup"){ saveNow(); const c=JSON.parse(JSON.stringify(cur)); c.id=uid(); c.created=c.updated=Date.now(); c.p.projekt=(c.p.projekt?c.p.projekt+" ":"")+"(Kopie)"; c.p.datum=today();
    c.s.forEach(s=>{ s.id=uid(); s.lp=s.lp.map(()=>newLP()); }); c.a.sigP=c.a.sigK=""; c.a.maengel=""; cur=c; saveNow(); go({v:"projekt"}); toast("Kopie ohne Messwerte angelegt"); return; }
  if(a==="pdf"){ makePDF(); return; }
});
$("#pdfTop").addEventListener("click",()=>makePDF());
$("#backBtn").addEventListener("click",()=>{ saveNow(); cur=null; protos.sort((a,b)=>b.updated-a.updated); go({v:"list"}); });
async function importBackup(el){
  const f=el.files[0]; if(!f) return;
  try{ const txt=await new Response(f).text(); const d=JSON.parse(txt); const list=Array.isArray(d)?d:d.protokolle; if(!Array.isArray(list)) throw 0;
    let neu=0,akt=0; for(const p of list){ if(!p||!p.id||!p.p||!Array.isArray(p.s)) continue; const i=protos.findIndex(x=>x.id===p.id);
      if(i<0){protos.push(p);neu++;} else if((p.updated||0)>(protos[i].updated||0)){protos[i]=p;akt++;} }
    protos.sort((a,b)=>b.updated-a.updated); lsSave(); render(); toast(`${neu} neu, ${akt} aktualisiert`);
  }catch(e){ toast("Die Datei ist keine gültige Sicherung"); }
  el.value="";
}

// ================= Unterschrift =================
function setupSigs(){
  ["sigP","sigK"].forEach(k=>{
    const c=$("#"+k); if(!c) return;
    const dpr=window.devicePixelRatio||1, rc=c.getBoundingClientRect();
    c.width=Math.round(rc.width*dpr); c.height=Math.round(rc.height*dpr);
    const x=c.getContext("2d"); x.lineWidth=2.4*dpr; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle=getComputedStyle(document.body).color;
    if(cur.a[k]){ const img=new Image(); img.onload=()=>{ const r=Math.min(c.width/img.width,c.height/img.height); x.drawImage(img,0,0,img.width*r,img.height*r); }; img.src=cur.a[k]; }
    let on=false,last=null; const pos=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]; };
    c.addEventListener("pointerdown",e=>{ on=true; last=pos(e); c.setPointerCapture(e.pointerId); e.preventDefault(); });
    c.addEventListener("pointermove",e=>{ if(!on) return; const p=pos(e); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last=p; });
    const end=()=>{ if(!on) return; on=false; cur.a[k]=sigExport(c); scheduleSave(); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
  });
}
function sigExport(c){ const o=document.createElement("canvas"); o.width=Math.min(c.width,900); o.height=Math.round(c.height*o.width/c.width);
  const x=o.getContext("2d"); x.drawImage(c,0,0,o.width,o.height); const d=x.getImageData(0,0,o.width,o.height);
  for(let i=0;i<d.data.length;i+=4){ if(d.data[i+3]>0){ d.data[i]=20; d.data[i+1]=28; d.data[i+2]=40; } } x.putImageData(d,0,0); return o.toDataURL("image/png"); }

const PDFMAP={"≈":"ca.","Ω":"Ohm","≤":"<=","≥":">=","→":"->","↔":"<->","–":"-","Δ":"d","…":"...","·":"|","„":"\"","“":"\""};
const pt=s=>String(s??"").replace(/[≈Ω≤≥→↔–Δ…·„“]/g,c=>PDFMAP[c]);
function makePDF(){
  if(!window.jspdf){ toast("PDF-Erstellung nicht geladen"); return; }
  saveNow();
  let blob; try{ blob=buildPDF(cur); }catch(e){ toast("PDF konnte nicht erstellt werden"); return; }
  const base=(cur.p.auftragsnr||cur.p.projekt||"Protokoll").replace(/[^\wÄÖÜäöüß\-]+/g,"_");
  saveFile(blob,`EVSE-Prüfprotokoll_${base}_${cur.p.datum||today()}.pdf`);
  toast("PDF erstellt – über Teilen oder „In Dateien sichern“ ablegen");
}
function buildPDF(P){
  const {jsPDF}=window.jspdf, d=new jsPDF({unit:"mm",format:"a4"});
  const W=210,M=14,CW=W-2*M, NAVY=[23,50,79],SIG=[242,183,5],GR=[93,107,123],LINE=[211,218,227],OKC=[31,138,76],BADC=[198,40,40],SUNK=[238,241,245];
  let y=0,page=1;
  const head=(t,s)=>{ d.setFillColor(...NAVY); d.rect(0,0,W,24,"F"); d.setFillColor(...SIG); d.rect(0,24,W,1.2,"F");
    d.setTextColor(255); d.setFont("helvetica","bold"); d.setFontSize(15); d.text(pt(t),M,11); d.setFont("helvetica","normal"); d.setFontSize(8.5); d.text(pt(s),M,18);
    d.setFontSize(8); d.text("EVSE-Prüfprotokoll",W-M,11,{align:"right"}); d.text(pt(`${P.p.geraet} + ${P.p.adapter}`),W-M,18,{align:"right"}); y=33; };
  const foot=()=>{ d.setFontSize(7); d.setTextColor(...GR); d.text(pt(`${P.p.projekt||""} | Auftrag ${P.p.auftragsnr||"-"} | Prüfdatum ${deDate(P.p.datum)}`),M,290); d.text(`Seite ${page}`,W-M,290,{align:"right"}); };
  const np=(t,s)=>{ foot(); d.addPage(); page++; head(t,s); };
  const sec=t=>{ d.setFillColor(...SUNK); d.rect(M,y-4.5,CW,7,"F"); d.setFillColor(...NAVY); d.rect(M,y-4.5,1.2,7,"F"); d.setTextColor(...NAVY); d.setFont("helvetica","bold"); d.setFontSize(9.5); d.text(pt(t),M+4,y); y+=8; };
  const kv=prs=>{ const cw=CW/2; d.setFontSize(8.5); for(let i=0;i<prs.length;i+=2){ let rh=5.5; for(let c=0;c<2&&i+c<prs.length;c++){ const [k,v]=prs[i+c],x=M+c*cw;
      d.setFont("helvetica","normal"); d.setTextColor(...GR); d.text(pt(k),x,y); d.setFont("helvetica","bold"); d.setTextColor(20); const l=d.splitTextToSize(pt(v||"-"),cw-34); d.text(l,x+32,y); rh=Math.max(rh,l.length*4+1.5); }
      d.setDrawColor(...LINE); d.line(M,y+1.6,M+CW,y+1.6); y+=rh+1.2; } y+=2; };
  const para=t=>{ d.setFont("helvetica","normal"); d.setFontSize(8.5); d.setTextColor(30); const l=d.splitTextToSize(pt(t||"-"),CW); d.text(l,M,y); y+=l.length*4+4; };
  const badge=(x,yy,r)=>{ const col=r==="ok"?OKC:r==="bad"?BADC:GR; d.setFillColor(...col); const t=RES_TXT[r].toUpperCase(); d.setFontSize(7.5); d.setFont("helvetica","bold"); const w=d.getTextWidth(t)+5; d.roundedRect(x-w,yy-3.6,w,5,1.2,1.2,"F"); d.setTextColor(255); d.text(t,x-w+2.5,yy); };

  head("Prüfprotokoll Ladeeinrichtungen",`${P.p.art} | ${P.p.normen.join(" | ")}`);
  sec("Projektdaten");
  kv([["Projekt",P.p.projekt],["Auftragsnr.",P.p.auftragsnr],["Auftraggeber",P.p.auftraggeber],["Standort",P.p.standort],["Prüfdatum",deDate(P.p.datum)],["Prüfer",P.p.pruefer],
      ["Messgerät",P.p.geraet],["Seriennr.",P.p.geraetSn],["Prüfadapter",P.p.adapter],["Kal. gültig bis",P.p.kal],["Art der Prüfung",P.p.art],["Netzform",`${P.p.netz} | 230/400 V`]]);
  sec("Prüfumfang"); para(P.p.umfang);
  sec("Übersicht Ladesäulen");
  d.setFillColor(...NAVY); d.rect(M,y-4,CW,6,"F"); d.setTextColor(255); d.setFontSize(8); d.setFont("helvetica","bold");
  const oc=[M+2,M+42,M+100,M+140]; ["Ladesäule","Hersteller / Typ","Seriennummer","Ladepunkte"].forEach((t,i)=>d.text(t,oc[i],y)); d.text("Ergebnis",M+CW-2,y,{align:"right"}); y+=6;
  P.s.forEach((s,i)=>{ if(y>270) np("Übersicht (Fortsetzung)",""); if(i%2){ d.setFillColor(...SUNK); d.rect(M,y-4,CW,6,"F"); } d.setFont("helvetica","normal"); d.setTextColor(20);
    d.text(pt(s.name),oc[0],y); d.text(pt(d.splitTextToSize(s.typ||"-",56)[0]),oc[1],y); d.text(pt(s.sn||"-"),oc[2],y); d.text(String(s.lps),oc[3],y); badge(M+CW-1,y,saeuleResult(s)); y+=6; });

  P.s.forEach(s=>{
    np(s.name,[s.typ,s.ort].filter(Boolean).join(" | ")||"Ladesäule");
    const z=zsInfo(s); sec("Gerätedaten");
    kv([["Hersteller / Typ",s.typ],["Seriennummer",s.sn],["Standort",s.ort],["Firmware",s.fw],["Absicherung",s.absTyp==="manuell"?"lt. Tabelle":`${s.absTyp}${s.absIn} A`],["Zs zulässig",isNaN(z.zul)?"-":`${fmt(z.zul,2)} Ohm`],
        ["RCD",`Typ ${s.rcd}, ${s.idn} mA`],["Nennstrom je LP",s.inenn?`${s.inenn} A`:"-"],["Freigabe",s.freigabe],["Anschluss",s.phasen===3?"3-phasig":"1-phasig"]]);
    const cP=M+2,cS=M+70,c1=M+118,c2=M+152;
    d.setFillColor(...NAVY); d.rect(M,y-4,CW,6.5,"F"); d.setTextColor(255); d.setFont("helvetica","bold"); d.setFontSize(8);
    d.text("Prüfung",cP,y); d.text("Sollwert",cS,y); d.text("LP 1 (links)",c1,y); if(s.lps===2) d.text("LP 2 (rechts)",c2,y); y+=6.5;
    for(const g of GROUPS){
      const rows=g.rows.filter(r=>rowVisible(r,s)); if(!rows.length) continue;
      d.setFillColor(...SUNK); d.rect(M,y-3.6,CW,5,"F"); d.setTextColor(...NAVY); d.setFont("helvetica","bold"); d.setFontSize(7.5); d.text(pt(`${g.t} (${g.sub})`),cP,y); y+=5.4;
      rows.forEach((r,ri)=>{
        if(ri%2){ d.setFillColor(250,251,252); d.rect(M,y-3.6,CW,5,"F"); }
        d.setFont("helvetica","normal"); d.setFontSize(8); d.setTextColor(20); d.text(pt(r.l),cP,y); d.setTextColor(...GR); d.text(pt(sollOf(r,s)).slice(0,32),cS,y);
        for(let li=0;li<s.lps;li++){ const x=li?c2:c1, val=s.lp[li].v[r.k]??"", e=evalRow(r,val,s);
          const t=r.type==="chk"?(val==="ok"?"i.O.":val==="nok"?"n.i.O.":"-"):(val===""?"-":`${val}${r.u?" "+r.u:""}`);
          d.setTextColor(...(e==="ok"?OKC:e==="bad"?BADC:GR)); d.setFont("helvetica",e==="open"?"normal":"bold"); d.text(pt(t),x,y); }
        y+=5;
      });
    }
    y+=3;
    for(let li=0;li<s.lps;li++){ const lp=s.lp[li]; d.setDrawColor(...LINE); d.line(M,y-3,M+CW,y-3);
      d.setFont("helvetica","bold"); d.setFontSize(8.5); d.setTextColor(...NAVY); d.text(`Ergebnis LP ${li+1}${s.lps===2?(li?" (rechts)":" (links)"):""}`,M+2,y+1.5); badge(M+CW-1,y+1.5,lpResult(s,li)); y+=6;
      if(lp.bem){ d.setFont("helvetica","normal"); d.setTextColor(30); const l=d.splitTextToSize(pt("Bemerkung: "+lp.bem),CW-4); d.text(l,M+2,y); y+=l.length*4+1; } y+=1; }
  });

  np("Abschluss","Gesamtergebnis | Mängel | Unterschriften");
  const g=protoResult(P); sec("Gesamtergebnis");
  d.setFont("helvetica","bold"); d.setFontSize(10); d.setTextColor(20);
  d.text(pt(g==="ok"?"Keine Mängel festgestellt. Die Ladeeinrichtungen entsprechen den Anforderungen.":g==="bad"?"Mängel festgestellt - Beseitigung erforderlich.":"Prüfung unvollständig - nicht alle Werte erfasst."),M,y); badge(M+CW-1,y,g); y+=9;
  sec("Festgestellte Mängel / Maßnahmen"); para(P.a.maengel||"Keine.");
  sec("Funktionsprüfung mit Prüfadapter"); para(P.a.funktion);
  sec("Nächste Prüfung"); para(P.a.naechste?`Empfohlen bis ${deDate(P.a.naechste)}`:"Nach Festlegung des Betreibers (Gefährdungsbeurteilung).");
  sec("Unterschriften"); y+=2;
  const sw=(CW-12)/2;
  [["sigP","sigPName","Prüfer"],["sigK","sigKName","Auftraggeber"]].forEach(([k,n,l],i)=>{ const x=M+i*(sw+12);
    if(P.a[k]){ try{ const ip=d.getImageProperties(P.a[k]); let h=sw*ip.height/ip.width,w=sw; if(h>28){ h=28; w=h*ip.width/ip.height; } d.addImage(P.a[k],"PNG",x,y+28-h,w,h); }catch(e){} }
    d.setDrawColor(40); d.line(x,y+30,x+sw,y+30); d.setFont("helvetica","normal"); d.setFontSize(8); d.setTextColor(...GR);
    d.text(pt(`${l}: ${P.a[n]||(i?"":P.p.pruefer)||""} | ${deDate(P.p.datum)}`),x,y+35); });
  foot();
  return d.output("blob");
}
